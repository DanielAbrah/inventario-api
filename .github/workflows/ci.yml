name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore InventarioApi.slnx
      - run: dotnet build InventarioApi.slnx --no-restore --configuration Release
      - run: dotnet test InventarioApi.slnx --no-build --configuration Release
